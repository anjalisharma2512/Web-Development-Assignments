<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        
        <form id="weather-form">
            <input
                type="text"
                id="location-input"
                placeholder="Enter city name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <div id="loading"></div>
        <div id="error"></div>
        <div id="weather-container"></div>
    </div>

</body>
</html>
