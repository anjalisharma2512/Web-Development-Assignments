<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">

            <div class="logo-container">
                <img
                    src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
                    alt="Odin logo"
                    class="odin-logo"
                >

                <span class="odin-text">ODIN</span>
            </div>

            <div class="photo-credit">
                Photo by
                <a href="https://unsplash.com/" target="_blank">
                    Halie West
                </a>
                on
                <a href="https://unsplash.com/" target="_blank">
                    Unsplash
                </a>
            </div>

        </aside>


        <!-- RIGHT SIDE -->
        <main class="main-content">

            <!-- INTRODUCTION -->
            <section class="intro">

                <p>
                    This is not a real online service! You know you need
                    something like this in your life to help you realize
                    your deepest dreams.
                </p>

                <p>
                    Sign up <strong>now</strong> to get started.
                </p>

                <p>
                    You <em>know</em> you want to.
                </p>

            </section>


            <!-- FORM -->
            <section class="form-section">

                <h2>Let's do this!</h2>

                <form>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="first-name">
                                FIRST NAME
                            </label>

                            <input
                                type="text"
                                id="first-name"
                                name="first-name"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="last-name">
                                LAST NAME
                            </label>

                            <input
                                type="text"
                                id="last-name"
                                name="last-name"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="email">
                                EMAIL
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="phone">
                                PHONE NUMBER
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="password">
                                PASSWORD
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                minlength="8"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="confirm-password">
                                CONFIRM PASSWORD
                            </label>

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirm-password"
                                minlength="8"
                                required
                            >
                        </div>

                    </div>

                </form>

            </section>


            <!-- BOTTOM -->
            <section class="bottom-section">

                <button type="submit">
                    Create Account
                </button>

                <p>
                    Already have an account?
                    <a href="#">Log in</a>
                </p>

            </section>

        </main>

    </div>

</body>
</html>
